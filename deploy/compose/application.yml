name: ${COMPOSE_PROJECT_NAME}

services:
  storage-init:
    image: ${PHP_FPM_IMAGE:-matahari-php:8.4.21-1}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        install -d -o 10001 -g 10001 /runtime/app/private /runtime/framework/cache/data /runtime/framework/sessions /runtime/framework/views /runtime/logs
        cp -a /release/current/backend/bootstrap/cache/. /bootstrap-cache/
        chown -R 10001:10001 /bootstrap-cache
    volumes:
      - ${RELEASE_ROOT}/current:/release/current:ro
      - runtime_storage:/runtime
      - bootstrap_cache:/bootstrap-cache
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  php:
    image: ${PHP_FPM_IMAGE:-matahari-php:8.4.21-1}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE}
    volumes:
      - ${RELEASE_ROOT}/current:/var/www/matahari/current:ro
      - runtime_storage:/var/www/matahari/current/backend/storage
      - bootstrap_cache:/var/www/matahari/current/backend/bootstrap/cache
    networks:
      - application
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: ${PHP_FPM_IMAGE:-matahari-php:8.4.21-1}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    env_file:
      - ${APP_ENV_FILE}
    volumes:
      - ${RELEASE_ROOT}/current:/var/www/matahari/current:ro
      - runtime_storage:/var/www/matahari/current/backend/storage
      - bootstrap_cache:/var/www/matahari/current/backend/bootstrap/cache
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage-init:
        condition: service_completed_successfully

  web:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT}:8080"
    volumes:
      - ${RELEASE_ROOT}/current:/var/www/matahari/current:ro
      - ../docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  runtime_storage:
    name: ${COMPOSE_PROJECT_NAME}_runtime_storage
  bootstrap_cache:
    name: ${COMPOSE_PROJECT_NAME}_bootstrap_cache

networks:
  application:
    internal: true
  database:
    external: true
    name: matahari_database
