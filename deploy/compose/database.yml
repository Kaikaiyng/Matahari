name: rylay_database

services:
  mariadb:
    image: mariadb:11.4.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      STAGING_DB_DATABASE: ${STAGING_DB_DATABASE}
      STAGING_DB_USERNAME: ${STAGING_DB_USERNAME}
      STAGING_MIGRATOR_USERNAME: ${STAGING_MIGRATOR_USERNAME}
      PRODUCTION_DB_DATABASE: ${PRODUCTION_DB_DATABASE}
      PRODUCTION_DB_USERNAME: ${PRODUCTION_DB_USERNAME}
      PRODUCTION_MIGRATOR_USERNAME: ${PRODUCTION_MIGRATOR_USERNAME}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --log-bin=rylay-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=2678400
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../database/init-databases.sh:/docker-entrypoint-initdb.d/10-rylay.sh:ro
      - ../database/apply-runtime-grants.sh:/usr/local/sbin/apply-runtime-grants:ro
    secrets:
      - mariadb_root_password
      - staging_app_password
      - staging_migrator_password
      - production_app_password
      - production_migrator_password
    networks:
      - database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  mariadb_data:
    name: rylay_mariadb_data

networks:
  database:
    name: rylay_database
    internal: true

secrets:
  mariadb_root_password:
    file: ${MARIADB_ROOT_PASSWORD_FILE}
  staging_app_password:
    file: ${STAGING_APP_PASSWORD_FILE}
  staging_migrator_password:
    file: ${STAGING_MIGRATOR_PASSWORD_FILE}
  production_app_password:
    file: ${PRODUCTION_APP_PASSWORD_FILE}
  production_migrator_password:
    file: ${PRODUCTION_MIGRATOR_PASSWORD_FILE}
