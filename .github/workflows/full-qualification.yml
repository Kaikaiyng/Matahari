name: Full qualification

on:
  workflow_call:
    inputs:
      commit:
        description: Exact Git commit to qualify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character Git commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Full application and PostgreSQL qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: disposable_ci_only_postgres_password_00001
          POSTGRES_DB: matahari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d matahari_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: matahari_test
      DB_USERNAME: postgres
      DB_PASSWORD: disposable_ci_only_postgres_password_00001
      DB_URL: ''
      MATAHARI_PGSQL_TEST_ALLOW_RESET: '1'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_pgsql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
      - name: Run complete backend validation
        working-directory: backend
        run: |
          php artisan test
          vendor/bin/pint --test
          php artisan route:list --path=api --except-vendor
          php artisan route:list --path=health --except-vendor
          composer audit --locked
      - name: Verify disposable PostgreSQL migration lifecycle
        working-directory: backend
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan test tests/Feature/PostgresSchemaTest.php
      - name: Verify PostgreSQL runtime privileges and deployment isolation
        env:
          POSTGRES_SECRETS_DIR: ${{ runner.temp }}/matahari-pg-secrets
        run: sh deploy/tests/verify-postgres-grants.sh
      - name: Verify SQLite demo compatibility
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
      - name: Rehearse PostgreSQL backup and restore on fictional data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test "$DB_DATABASE" = matahari_test
          test "$MATAHARI_PGSQL_TEST_ALLOW_RESET" = 1
          (cd backend && php artisan migrate --force && php artisan db:seed --force)
          docker cp deploy/scripts/backup-postgres.sh "$PG_CONTAINER:/tmp/backup-postgres.sh"
          docker cp deploy/scripts/verify-postgres-restore.sh "$PG_CONTAINER:/tmp/verify-postgres-restore.sh"
          docker exec -i -e REHEARSAL_PASSWORD="$DB_PASSWORD" "$PG_CONTAINER" sh <<'SH'
          set -eu
          umask 077
          mkdir /tmp/matahari-recovery
          printf '127.0.0.1:5432:*:postgres:%s\n' "$REHEARSAL_PASSWORD" > /tmp/matahari-recovery/pgpass
          unset REHEARSAL_PASSWORD
          export PGPASSFILE=/tmp/matahari-recovery/pgpass
          sh /tmp/backup-postgres.sh --database matahari_test --output-directory /tmp/matahari-recovery
          set -- /tmp/matahari-recovery/*.dump
          MATAHARI_POSTGRES_RESTORE_VERIFY=1 sh /tmp/verify-postgres-restore.sh --archive "$1" --database matahari_restore_verify_ci
          for database in matahari_test matahari_restore_verify_ci; do
            pg_dump --no-password --host=127.0.0.1 --username=postgres --dbname="$database" --data-only --no-owner --no-privileges --restrict-key=MatahariRehearsal > "/tmp/matahari-recovery/$database.sql"
          done
          cmp /tmp/matahari-recovery/matahari_test.sql /tmp/matahari-recovery/matahari_restore_verify_ci.sql
          echo 'Source and restored table data and sequences match.'
          SH
      - name: Run complete frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
      - name: Run complete Parent/Student App validation
        working-directory: app
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
      - name: Run deployment contract suite
        run: node --test deploy/tests/*.test.mjs
